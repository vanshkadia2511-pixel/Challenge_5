<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Glowing aura -->
  <circle cx="100" cy="100" r="90" fill="url(#auraGrad)" opacity="0.6"/>
  <!-- Robot Body -->
  <defs>
    <radialGradient id="auraGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8A33D" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FBF7F0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F3ECE0"/>
      <stop offset="100%" stop-color="#D9C9B4"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142834"/>
      <stop offset="100%" stop-color="#0E1B23"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#E8A33D"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- Antenna -->
  <path d="M 100 45 L 100 25" stroke="#B45309" stroke-width="4" stroke-linecap="round"/>
  <circle cx="100" cy="20" r="7" fill="url(#goldGrad)"/>

  <!-- Ears / Ear Cups -->
  <rect x="36" y="70" width="12" height="28" rx="6" fill="url(#goldGrad)"/>
  <rect x="152" y="70" width="12" height="28" rx="6" fill="url(#goldGrad)"/>

  <!-- Head -->
  <rect x="44" y="45" width="112" height="78" rx="36" fill="url(#metalGrad)" stroke="#B45309" stroke-width="2"/>
  <!-- Head highlight -->
  <ellipse cx="100" cy="52" rx="40" ry="4" fill="#FFFFFF" opacity="0.6"/>

  <!-- Visor Screen -->
  <rect x="58" y="58" width="84" height="52" rx="22" fill="url(#screenGrad)"/>

  <!-- Blue Glowing Eyes -->
  <ellipse cx="80" cy="80" rx="9" ry="13" fill="url(#eyeGrad)"/>
  <ellipse cx="120" cy="80" rx="9" ry="13" fill="url(#eyeGrad)"/>
  <!-- Eye highlights -->
  <circle cx="78" cy="76" r="3" fill="#FFFFFF"/>
  <circle cx="118" cy="76" r="3" fill="#FFFFFF"/>

  <!-- Cheerful Smile -->
  <path d="M 90 94 Q 100 102 110 94" stroke="url(#eyeGrad)" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Neck -->
  <rect x="90" y="122" width="20" height="10" rx="4" fill="#C9BBAA"/>

  <!-- Torso -->
  <rect x="66" y="130" width="68" height="56" rx="20" fill="url(#metalGrad)" stroke="#B45309" stroke-width="1.5"/>

  <!-- Saffron Bow Tie -->
  <path d="M 88 135 L 100 142 L 88 149 Z" fill="url(#goldGrad)"/>
  <path d="M 112 135 L 100 142 L 112 149 Z" fill="url(#goldGrad)"/>
  <circle cx="100" cy="142" r="3.5" fill="#78350F"/>

  <!-- Right Arm with Star Wand -->
  <!-- Arm -->
  <path d="M 132 145 Q 155 130 162 108" stroke="url(#metalGrad)" stroke-width="10" stroke-linecap="round"/>
  <!-- Hand -->
  <circle cx="162" cy="106" r="6" fill="#D9C9B4"/>
  <!-- Wand stick -->
  <path d="M 160 120 L 175 75" stroke="#78350F" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Magic Star -->
  <polygon points="175,60 178,70 188,71 180,78 183,88 175,82 167,88 170,78 162,71 172,70" fill="url(#goldGrad)" stroke="#FFFFFF" stroke-width="1"/>
  <!-- Sparkles -->
  <circle cx="188" cy="62" r="2.5" fill="#FCD34D"/>
  <circle cx="162" cy="62" r="2" fill="#FCD34D"/>
</svg>